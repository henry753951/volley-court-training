  reason: "the repeated 0.72 origin value did not match the observed floor boundary, which varies by arena"
  projection_model: "Blender World equirectangular environment"
  distance_control: "mapping_scale Z is an apparent-distance correction; World environments have no effective sphere radius"
  focus_policy: "background remains broad-focus; rare full-frame defocus is controlled by capture.blur_modes"
