[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "volley-court-lines"
version = "0.2.0"
description = "Fast typed volleyball court-line inference, visualization, and training"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "HSULab" }]
keywords = ["computer-vision", "pytorch", "volleyball", "court", "keypoints"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<5.1",
    "pillow>=11,<13",
    "pyyaml>=6.0,<7",
    "torch>=2.7,<3",
    "ultralytics>=8.4,<9",
]

[project.urls]
Repository = "https://github.com/henry753951/volley-court-training"
Documentation = "https://github.com/henry753951/volley-court-training#readme"

[project.scripts]
volley-court = "volley_court.cli:main"
volley-court-convert = "volley_court.convert_dataset:main"
volley-court-evaluate = "volley_court.evaluate_layout:main"
volley-court-train = "volley_court.train:main"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "pyright>=1.1.400,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/volley_court"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/configs",
    "/docs",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["blender", "datasets", "video-evals", "test-videos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PERF", "RUF"]
ignore = ["B023", "E501", "PERF401", "RUF046"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = [
    "src/volley_court/__init__.py",
    "src/volley_court/api.py",
    "src/volley_court/assets.py",
    "src/volley_court/benchmark.py",
    "src/volley_court/cli.py",
    "src/volley_court/types.py",
    "src/volley_court/tracking.py",
    "src/volley_court/video.py",
    "src/volley_court/visualization.py",
]
exclude = ["blender", "datasets", "video-evals", "test-videos"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false
